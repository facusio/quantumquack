name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.github/workflows/ci.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TF_DIR: infra/envs/dev
  REGION: us-central1
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
  TF_VAR_enable_lb: ${{ vars.ENABLE_LB || 'false' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Aprobación manual: el environment "dev" tiene "Required reviewers".
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"

      # El registro tiene que existir antes de subir la imagen.
      - name: Crear Artifact Registry
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve -target=module.registry

      - name: Build y push (tag = commit)
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/quantumquack/app:${GITHUB_SHA::7}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" app
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: terraform apply (nueva revisión de Cloud Run)
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve -var="image=${IMAGE}"

      - name: Resumen
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "### Desplegado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $(terraform output -raw app_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "- IP del LB: $(terraform output -raw lb_ip 2>/dev/null || echo 'no creado')" >> "$GITHUB_STEP_SUMMARY"
